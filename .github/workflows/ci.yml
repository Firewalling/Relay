name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Rust and Go quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Run strict Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run all Rust tests
        run: cargo test --all-targets --all-features
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run Go vet
        run: go vet ./...
      - name: Run all Go tests
        run: go test -race ./...
      - name: Build Go supervisor integration binary
        run: go build -o "$RUNNER_TEMP/relay-supervisor" ./cmd/relay-supervisor
      - name: Run Rust-to-Go supervisor integration test
        run: cargo test --test supervise real_go_supervisor_e2e_when_configured
        env:
          RELAY_SUPERVISOR_E2E_BIN: ${{ runner.temp }}/relay-supervisor
